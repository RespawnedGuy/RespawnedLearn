# Prüft jeden Push und baut die App für Windows und Android. Steht in package.json eine neue Version, veröffentlicht
# der letzte Job einen GitHub Release mit Installer, APK und Prüfsummen (Anleitung: docs/installieren.md).
# Signaturen hängen nur an Secrets, nie am Repo:
#   ANDROID_KEY_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD  → APK mit eigenem Schlüssel (sonst Debug-APK)
#   WINDOWS_PFX_BASE64, WINDOWS_PFX_PASSWORT                      → signierter Installer (sonst unsigniert + Signierprobe)
name: Bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: bauen-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pruefen:
    name: Tests und Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - name: Bibliotheken für Tauri unter Linux
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - name: Rust-Tests (Datenordner)
        working-directory: app/src-tauri
        run: cargo test --locked

  windows:
    name: Windows-Installer
    needs: pruefen
    runs-on: windows-2022
    env:
      HAT_ZERTIFIKAT: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
    defaults:
      run: { shell: pwsh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - run: npm ci
      # Tauri ruft signCommand für die App-EXE und beide Installer auf (%1 = Datei)
      - name: Signierbefehl für Tauri
        run: |
          $skript = Join-Path $env:GITHUB_WORKSPACE 'tools\windows-signieren.ps1'
          @{ bundle = @{ windows = @{ signCommand = @{ cmd = 'powershell'; args = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $skript, '%1') } } } } |
            ConvertTo-Json -Depth 6 | Set-Content (Join-Path $env:RUNNER_TEMP 'signieren.json') -Encoding utf8
      - name: Installer bauen
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORT: ${{ secrets.WINDOWS_PFX_PASSWORT }}
        run: |
          if ($env:HAT_ZERTIFIKAT -eq 'true') { npm run tauri -- build --config (Join-Path $env:RUNNER_TEMP 'signieren.json') }
          else { npm run tauri -- build }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory ausgabe | Out-Null
          Copy-Item app/src-tauri/target/release/bundle/nsis/*.exe, app/src-tauri/target/release/bundle/msi/*.msi ausgabe/
          Get-ChildItem ausgabe | ForEach-Object { Write-Host $_.Name }
      - name: Signatur prüfen
        if: env.HAT_ZERTIFIKAT == 'true'
        run: |
          $dateien = @('app/src-tauri/target/release/respawnedlearn.exe') + (Get-ChildItem ausgabe/*).FullName
          ./tools/windows-signatur-pruefen.ps1 @dateien
      # Ohne Zertifikat: derselbe Weg mit einem Wegwerf-Zertifikat, damit der Schalter beim Einschalten sicher läuft.
      # Veröffentlicht wird nur der unsignierte Stand aus „ausgabe“.
      - name: Signierprobe vorbereiten
        if: env.HAT_ZERTIFIKAT != 'true'
        run: ./tools/windows-signierprobe.ps1
      - name: Signierprobe bauen und prüfen
        if: env.HAT_ZERTIFIKAT != 'true'
        run: |
          npm run tauri -- build --config (Join-Path $env:RUNNER_TEMP 'signieren.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dateien = @('app/src-tauri/target/release/respawnedlearn.exe') +
            (Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe, app/src-tauri/target/release/bundle/msi/*.msi).FullName
          ./tools/windows-signatur-pruefen.ps1 @dateien -Fingerabdruck $env:PROBE_FINGERABDRUCK
          # die veröffentlichten Pakete bleiben unsigniert
          foreach ($d in Get-ChildItem ausgabe/*) {
            if ((Get-AuthenticodeSignature $d.FullName).Status -ne 'NotSigned') { throw "Probe hat $($d.Name) verändert" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: respawnedlearn-windows
          path: ausgabe/*

  android:
    name: Android-APK
    needs: pruefen
    runs-on: ubuntu-24.04
    env:
      HAT_SCHLUESSEL: ${{ secrets.ANDROID_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Das Android-SDK liegt auf dem Runner schon bereit (ANDROID_HOME), es fehlen nur NDK und Plattform
      - name: Android-NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - run: npm ci
      - name: Android-Projekt erzeugen
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          npm run tauri android init -- --ci
      # Schlüssel nur im Temp-Ordner des Runners; keystore.properties liegt in gen/ (nicht versioniert)
      - name: Schlüssel für die Release-Signatur
        if: env.HAT_SCHLUESSEL == 'true'
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/respawnedlearn.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/respawnedlearn.jks"
          } > app/src-tauri/gen/android/keystore.properties
      - name: Android-Projekt anpassen
        run: node tools/android-anpassen.mjs
      - name: APK bauen
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          if [ "$HAT_SCHLUESSEL" = true ]; then npm run tauri android build -- --apk --target aarch64
          else npm run tauri android build -- --apk --debug --target aarch64; fi
      - name: Signatur prüfen und APK benennen
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$HAT_SCHLUESSEL" = true ]; then art=release; name="RespawnedLearn_${version}_arm64.apk"
          else art=debug; name="RespawnedLearn_${version}_arm64_debug.apk"; fi
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk -path "*/$art/*.apk" | head -n 1)
          test -n "$apk" || { echo "Keine $art-APK gefunden"; exit 1; }
          zertifikat=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk")
          echo "$zertifikat"
          if [ "$HAT_SCHLUESSEL" = true ] && echo "$zertifikat" | grep -q "CN=Android Debug"; then
            echo "Release-APK trägt den Debug-Schlüssel"; exit 1
          fi
          mkdir -p ausgabe && cp "$apk" "ausgabe/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: respawnedlearn-android
          path: ausgabe/*

  veroeffentlichen:
    name: Release
    needs: [windows, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Neue Version?
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then echo "neu=false" >> "$GITHUB_OUTPUT"; echo "v$version gibt es schon"
          else echo "neu=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.neu == 'true'
        with: { path: ausgabe, merge-multiple: true }
      - name: Prüfsummen und Release
        if: steps.version.outputs.neu == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HINWEIS: ${{ github.event.head_commit.message }}
        run: |
          cd ausgabe
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            printf '%s\n\n' "$(printf '%s' "$HINWEIS" | head -n 1)"
            echo "Installieren und Warnungen von Windows, Browser und Android: [docs/installieren.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/installieren.md)."
            echo "Prüfsummen (SHA-256) stehen in \`SHA256SUMS.txt\`."
          } > ../notizen.md
          vorab=""; case "$VERSION" in 0.*) vorab="--prerelease";; esac
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "RespawnedLearn $VERSION" --notes-file ../notizen.md $vorab -- *
      # Gegenprobe: was jetzt im Release liegt, muss zu den Prüfsummen passen
      - name: Release gegen Prüfsummen prüfen
        if: steps.version.outputs.neu == 'true'
        run: |
          mkdir geladen && cd geladen
          gh release download "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY"
          sha256sum -c SHA256SUMS.txt
