# Prüft jeden Push und baut die App für Windows und Android. Die Pakete liegen danach als Artefakte am Lauf.
name: Bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: bauen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruefen:
    name: Tests und Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - name: Bibliotheken für Tauri unter Linux
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - name: Rust-Tests (Datenordner)
        working-directory: app/src-tauri
        run: cargo test --locked

  windows:
    name: Windows-Installer
    needs: pruefen
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: respawnedlearn-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi

  android:
    name: Android-APK
    needs: pruefen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Das Android-SDK liegt auf dem Runner schon bereit (ANDROID_HOME), es fehlen nur NDK und Plattform
      - name: Android-NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - run: npm ci
      - name: Android-Projekt erzeugen und anpassen
        env: { NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/27.2.12479018" }
        run: |
          npm run tauri android init -- --ci
          node tools/android-anpassen.mjs
      # Vorerst Debug-Signatur: installierbar, aber nicht für den Play Store (Release-Signatur kommt in Schritt 4)
      - name: APK bauen
        env: { NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/27.2.12479018" }
        run: npm run tauri android build -- --apk --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: respawnedlearn-android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
