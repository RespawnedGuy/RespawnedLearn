# Prüft jeden Push und baut die App für Windows und Android. Steht in package.json eine neue Version, veröffentlicht
# der letzte Job einen GitHub Release mit Installer, APK und Prüfsummen (Anleitung: docs/installieren.md).
# Signaturen hängen nur an Secrets, nie am Repo. Sie liegen im Environment „release“: nur Branch main, jeder Lauf wartet
# auf Nils' Freigabe (docs/signieren.md). Actions sind auf Commits gepinnt, Dependabot schlägt neue vor.
#   ANDROID_KEY_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD  → APK mit eigenem Schlüssel (sonst Debug-APK)
#   WINDOWS_PFX_BASE64, WINDOWS_PFX_PASSWORT                      → signierter Installer (sonst unsigniert + Signierprobe)
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD → Updates: signierte Installer und APK, latest.json
#     dazu die Variable (kein Secret) TAURI_UPDATER_PUBKEY, der öffentliche Schlüssel, der in die App kommt
#     (docs/aktualisieren.md, Anleitung in docs/signieren.md)
name: Bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: bauen-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pruefen:
    name: Tests und Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - name: Bibliotheken für Tauri unter Linux
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, Stand 2026-10-15
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: app/src-tauri }
      - name: Rust-Tests (Datenordner)
        working-directory: app/src-tauri
        run: cargo test --locked

  windows:
    name: Windows-Installer
    needs: pruefen
    runs-on: windows-2022
    # Signatur-Secrets liegen im Environment „release“ (Freigabe durch Nils, nur Branch main); PRs bauen ohne sie
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release' || '' }}
    env:
      HAT_ZERTIFIKAT: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
      HAT_UPDATE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    defaults:
      run: { shell: pwsh }
    steps:
      # Auf main wird veröffentlicht: ohne Update-Schlüssel entstünde ein Release ohne latest.json
      - name: Schlüssel für den Release vorhanden?
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAT_UPDATE != 'true'
        run: |
          Write-Host "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt im Environment release (docs/signieren.md)"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, Stand 2026-10-15
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: app/src-tauri }
      - run: npm ci
      # Tauri ruft signCommand für die App-EXE und beide Installer auf (%1 = Datei)
      - name: Signierbefehl für Tauri
        run: |
          $skript = Join-Path $env:GITHUB_WORKSPACE 'tools\windows-signieren.ps1'
          @{ bundle = @{ windows = @{ signCommand = @{ cmd = 'powershell'; args = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $skript, '%1') } } } } |
            ConvertTo-Json -Depth 6 | Set-Content (Join-Path $env:RUNNER_TEMP 'signieren.json') -Encoding utf8
      # Mit Update-Schlüssel schreibt Tauri zu jedem Installer eine .sig (createUpdaterArtifacts); ohne ihn wie bisher
      # Der öffentliche Schlüssel kommt in die Konfiguration der App (plugins.updater.pubkey, aktualisieren.rs)
      - name: Update-Signatur vorbereiten
        if: env.HAT_UPDATE == 'true'
        env:
          UPDATE_SCHLUESSEL: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          $schluessel = ($env:UPDATE_SCHLUESSEL -replace '\s', '')
          if (-not $schluessel) {
            Write-Host "::error::Secret TAURI_SIGNING_PRIVATE_KEY ist gesetzt, die Variable TAURI_UPDATER_PUBKEY fehlt (docs/signieren.md)"
            exit 1
          }
          @{ bundle = @{ createUpdaterArtifacts = $true }; plugins = @{ updater = @{ pubkey = $schluessel } } } |
            ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:RUNNER_TEMP 'aktualisieren.json') -Encoding utf8
      - name: Installer bauen
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORT: ${{ secrets.WINDOWS_PFX_PASSWORT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $konfig = @()
          if ($env:HAT_ZERTIFIKAT -eq 'true') { $konfig += '--config', (Join-Path $env:RUNNER_TEMP 'signieren.json') }
          if ($env:HAT_UPDATE -eq 'true') { $konfig += '--config', (Join-Path $env:RUNNER_TEMP 'aktualisieren.json') }
          npm run tauri -- build @konfig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory ausgabe | Out-Null
          Copy-Item app/src-tauri/target/release/bundle/nsis/*.exe, app/src-tauri/target/release/bundle/msi/*.msi ausgabe/
          if ($env:HAT_UPDATE -eq 'true') {
            Copy-Item app/src-tauri/target/release/bundle/nsis/*.exe.sig, app/src-tauri/target/release/bundle/msi/*.msi.sig ausgabe/
            if ((Get-ChildItem ausgabe/*.sig).Count -ne 2) { throw 'Zu jedem Installer gehört eine .sig' }
          }
          Get-ChildItem ausgabe | ForEach-Object { Write-Host $_.Name }
      - name: Signatur prüfen
        if: env.HAT_ZERTIFIKAT == 'true'
        run: ./tools/windows-signatur-pruefen.ps1 -Installer (Get-ChildItem ausgabe/*.exe, ausgabe/*.msi).FullName
      # Ohne Zertifikat: derselbe Weg mit einem Wegwerf-Zertifikat, damit der Schalter beim Einschalten sicher läuft.
      # Veröffentlicht wird nur der unsignierte Stand aus „ausgabe“.
      - name: Signierprobe vorbereiten
        if: env.HAT_ZERTIFIKAT != 'true'
        run: ./tools/windows-signierprobe.ps1
      - name: Signierprobe bauen und prüfen
        if: env.HAT_ZERTIFIKAT != 'true'
        run: |
          npm run tauri -- build --config (Join-Path $env:RUNNER_TEMP 'signieren.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = (Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe, app/src-tauri/target/release/bundle/msi/*.msi).FullName
          ./tools/windows-signatur-pruefen.ps1 -Installer $installer -Fingerabdruck $env:PROBE_FINGERABDRUCK
          # die veröffentlichten Pakete bleiben unsigniert (die .sig daneben sind Update-Signaturen, keine Authenticode-Dateien)
          foreach ($d in Get-ChildItem ausgabe/*.exe, ausgabe/*.msi) {
            if ((Get-AuthenticodeSignature $d.FullName).Status -ne 'NotSigned') { throw "Probe hat $($d.Name) verändert" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: respawnedlearn-windows
          path: ausgabe/*

  android:
    name: Android-APK
    needs: pruefen
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release' || '' }}
    env:
      HAT_SCHLUESSEL: ${{ secrets.ANDROID_KEY_BASE64 != '' }}
      HAT_UPDATE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      # Auf main wird veröffentlicht: nie eine Debug-APK oder eine APK ohne Update-Signatur in einen Release
      - name: Schlüssel für den Release vorhanden?
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (env.HAT_SCHLUESSEL != 'true' || env.HAT_UPDATE != 'true')
        run: |
          echo "::error::Secrets ANDROID_KEY_BASE64/ANDROID_KEY_ALIAS/ANDROID_KEY_PASSWORD oder TAURI_SIGNING_PRIVATE_KEY fehlen im Environment release (docs/signieren.md)"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 17 }
      # Das Android-SDK liegt auf dem Runner schon bereit (ANDROID_HOME), es fehlen nur NDK und Plattform
      - name: Android-NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, Stand 2026-10-15
        with: { toolchain: stable, targets: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: app/src-tauri }
      - run: npm ci
      - name: Android-Projekt erzeugen
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          npm run tauri android init -- --ci
      # Schlüssel nur im Temp-Ordner des Runners; keystore.properties liegt in gen/ (nicht versioniert)
      - name: Schlüssel für die Release-Signatur
        if: env.HAT_SCHLUESSEL == 'true'
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Zeilenumbrüche und Leerzeichen aus der Zwischenablage (Windows: \r\n) stören Base64 und Passwort
          printf '%s' "$ANDROID_KEY_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/respawnedlearn.jks"
          alias=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n' | xargs)
          passwort=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')
          # früh und verständlich scheitern statt nach fünf Minuten im Gradle-Build
          # Passwort über die Umgebung statt als Argument (sonst in der Prozessliste sichtbar)
          if ! KEY_PW="$passwort" keytool -list -keystore "$RUNNER_TEMP/respawnedlearn.jks" -storepass:env KEY_PW -alias "$alias" > /dev/null; then
            echo "::error::Keystore, Passwort oder Alias passen nicht zusammen (Secrets ANDROID_KEY_*, siehe docs/signieren.md)"
            exit 1
          fi
          {
            echo "keyAlias=$alias"
            echo "password=$passwort"
            echo "storeFile=$RUNNER_TEMP/respawnedlearn.jks"
          } > app/src-tauri/gen/android/keystore.properties
      - name: Android-Projekt anpassen
        run: node tools/android-anpassen.mjs
      - name: APK bauen
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          if [ "$HAT_SCHLUESSEL" = true ]; then npm run tauri android build -- --apk --target aarch64
          else npm run tauri android build -- --apk --debug --target aarch64; fi
      - name: Signatur prüfen und APK benennen
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$HAT_SCHLUESSEL" = true ]; then art=release; name="RespawnedLearn_${version}_arm64.apk"
          else art=debug; name="RespawnedLearn_${version}_arm64_debug.apk"; fi
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk -path "*/$art/*.apk" | head -n 1)
          test -n "$apk" || { echo "Keine $art-APK gefunden"; exit 1; }
          zertifikat=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk")
          echo "$zertifikat"
          if [ "$HAT_SCHLUESSEL" = true ] && echo "$zertifikat" | grep -q "CN=Android Debug"; then
            echo "Release-APK trägt den Debug-Schlüssel"; exit 1
          fi
          mkdir -p ausgabe && cp "$apk" "ausgabe/$name"
      # Gleiche Update-Signatur wie am PC, damit latest.json für jede Datei eine trägt; installieren prüft Android selbst
      - name: Update-Signatur der APK
        if: env.HAT_UPDATE == 'true' && env.HAT_SCHLUESSEL == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          apk=$(ls ausgabe/*.apk)
          npx tauri signer sign "$apk"
          test -s "$apk.sig"
      # Schlüssel und Passwort nicht bis Jobende auf der Platte lassen (Post-Schritte anderer Actions laufen danach)
      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/respawnedlearn.jks" app/src-tauri/gen/android/keystore.properties
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: respawnedlearn-android
          path: ausgabe/*

  veroeffentlichen:
    name: Release
    needs: [windows, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Neue Version?
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then echo "neu=false" >> "$GITHUB_OUTPUT"; echo "v$version gibt es schon"
          else echo "neu=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.version.outputs.neu == 'true'
        with: { path: ausgabe, merge-multiple: true }
      - name: Prüfsummen und Release
        if: steps.version.outputs.neu == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HINWEIS: ${{ github.event.head_commit.message }}
          UPDATE_SCHLUESSEL: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          cd ausgabe
          # latest.json für die Updates (nur mit .sig-Dateien); prüft vorher jede Signatur gegen den Schlüssel der App
          UPDATE_SCHLUESSEL="$UPDATE_SCHLUESSEL" node ../tools/neueste.mjs bau . "$VERSION" "$GITHUB_REPOSITORY" "$(printf '%s' "$HINWEIS" | head -n 1)"
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            printf '%s\n\n' "$(printf '%s' "$HINWEIS" | head -n 1)"
            echo "Installieren und Warnungen von Windows, Browser und Android: [docs/installieren.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/installieren.md)."
            echo "Prüfsummen (SHA-256) stehen in \`SHA256SUMS.txt\`."
          } > ../notizen.md
          # Normaler Release (ab v0.20.0, Nils 13.11.): nur dann zeigt …/releases/latest/download/latest.json auf ihn
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "RespawnedLearn $VERSION" --notes-file ../notizen.md --latest -- *
      # Gegenprobe: was jetzt im Release liegt, muss zu den Prüfsummen passen
      - name: Release gegen Prüfsummen prüfen
        if: steps.version.outputs.neu == 'true'
        env:
          UPDATE_SCHLUESSEL: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          mkdir geladen && cd geladen
          gh release download "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY"
          sha256sum -c SHA256SUMS.txt
          node ../tools/neueste.mjs pruefe .
