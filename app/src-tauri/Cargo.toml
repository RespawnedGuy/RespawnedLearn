[package]
name = "respawnedlearn"
version = "0.1.0"
description = "RespawnedLearn: lernen mit eigenen Skripten, lokal, abgeglichen über Syncthing"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.85"

[lib]
# staticlib/cdylib braucht Android, rlib die Tests
name = "respawnedlearn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
notify = "=8.2.1"

[dev-dependencies]
tempfile = "=3.27.0"
