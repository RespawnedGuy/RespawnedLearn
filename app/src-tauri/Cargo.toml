[package]
name = "respawnedlearn"
version = "0.1.0"
description = "RespawnedLearn: lernen mit eigenen Skripten, lokal, abgeglichen über Syncthing"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.85"

[lib]
# staticlib/cdylib braucht Android, rlib die Tests
name = "respawnedlearn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
# KI-Anfragen über Rust statt über den Browser: Perplexity und Ollama sperren Browser-Anfragen (CORS); erlaubte Adressen in capabilities/default.json
tauri-plugin-http = "=2.8.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
notify = "=8.2.1"
# KI-Zugang verschlüsselt im Datenordner (tresor.rs): Argon2id nach RFC 9106 leitet aus dem Passwort einen Schlüssel ab,
# XChaCha20-Poly1305 verschlüsselt (RustCrypto); getrandom liefert Salz, Nonce und Datenschlüssel aus dem Betriebssystem
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
getrandom = "=0.4.3"

# Updates der App (aktualisieren.rs, docs/aktualisieren.md): nur am PC, Android kann sich nicht selbst ersetzen.
# Lädt den Installer aus dem neuesten GitHub-Release und installiert ihn nur mit gültiger Signatur des Update-Schlüssels.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.14.1"
# prüfen den eingebauten öffentlichen Schlüssel vorab (dieselben Crates und Versionen, die der Updater ohnehin nutzt)
minisign-verify = "=0.3.0"
base64 = "=0.23.1"

[dev-dependencies]
tempfile = "=3.27.0"

# Argon2id rechnet im Debug-Bau sonst zehnmal langsamer (cargo test, tauri dev)
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
